services:
  api:
    build:
      context: .
      target: runtime
    environment:
      PORT: 8000
      DATA_FILE: /data/booking-state.json
      # 未设置密钥时，对应角色接口返回 503（健康检查与公开目录不受影响）
      STAFF_API_KEY: ${STAFF_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - booking-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 2s
      retries: 5

volumes:
  booking-data:
